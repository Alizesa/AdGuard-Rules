name: Deduplicate anti-AD

on:
  schedule:
    # daily 03:23 UTC = 11:23 Beijing. anti-AD regenerates every day.
    - cron: '23 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dedupe
  cancel-in-progress: true

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download filter lists
        run: |
          mkdir -p lists
          curl -fsSL --retry 3 --max-time 120 -o lists/anti-ad.txt https://anti-ad.net/adguard.txt
          for id in 2 3 11 19 20 21 224; do
            curl -fsSL --retry 3 --max-time 120 -o "lists/adguard_${id}.txt" \
              "https://filters.adtidy.org/android/filters/${id}_optimized.txt"
          done
          wc -l lists/*.txt

      - name: Run deduplication
        run: |
          python scripts/dedupe.py
          echo "--- result ---"
          wc -l antiad-deduped.txt

      - name: Commit result if changed
        run: |
          git add antiad-deduped.txt
          if git diff --cached --quiet; then
            echo "No change in the deduplicated list."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update deduplicated anti-AD list $(date -u +%Y-%m-%d)"
            # Sync with any concurrent run (rare with the concurrency guard, cheap insurance).
            git pull --rebase --autostash origin main || true
            git push
          fi

      # GitHub Pages is configured to build from the gh-pages branch, so
      # deploying = pushing the freshly generated list to that branch.
      # Pure git, no Node-dependent actions involved.
      - name: Deploy to Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN is empty - cannot authenticate gh-pages push"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ghpages"
          mkdir -p "$RUNNER_TEMP/ghpages"
          cp antiad-deduped.txt "$RUNNER_TEMP/ghpages/"
          touch "$RUNNER_TEMP/ghpages/.nojekyll"
          cd "$RUNNER_TEMP/ghpages"
          git init -q
          git remote add origin "https://github.com/Alizesa/AdGuard-Rules.git"
          # Authenticate with the workflow token (available as GITHUB_TOKEN env)
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${GH_TOKEN}" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 origin gh-pages 2>/dev/null || true
          if git rev-parse -q --verify origin/gh-pages >/dev/null 2>&1; then
            git reset -q --soft origin/gh-pages
            git add -A
            if git diff --cached --quiet; then
              echo "gh-pages unchanged, nothing to deploy"
              exit 0
            fi
            git commit -q -m "deploy: update antiad-deduped.txt $(date -u +%Y-%m-%d)"
          else
            git add -A
            git commit -q -m "deploy: initial antiad-deduped.txt $(date -u +%Y-%m-%d)"
          fi
          git push -q origin HEAD:gh-pages
          echo "deployed to gh-pages"
